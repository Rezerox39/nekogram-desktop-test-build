# Nekogram Desktop — Temporary Public Windows Test Build
# NON_PRODUCTION_TEST_BUILD_NO_CRASH_REPORTS

name: Nekogram Desktop Windows Test Build

on:
  workflow_dispatch:
  push:
    branches: [main, feature/nekogram-translation-p03b]

env:
  TDESKTOP_COMMIT: 087b18b89194ab474526ca61b7992f32f52c983b
  TDESKTOP_BRANCH: dev

jobs:
  windows-build:
    name: Windows x64 Test Build (no-breakpad)
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout test-build repo
        uses: actions/checkout@v4

      - name: Verify checkout
        shell: bash
        run: |
          echo "=== GITHUB_WORKSPACE: $GITHUB_WORKSPACE ==="
          echo "=== Files in workspace ==="
          ls -la "$GITHUB_WORKSPACE/"
          echo "=== Files in patches ==="
          ls -la "$GITHUB_WORKSPACE/patches/"
          echo "=== Patch file exists ==="
          test -f "$GITHUB_WORKSPACE/patches/p03b.patch" && echo "YES" || echo "NO"

      - name: Install Python 3.10+
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Clone tdesktop source
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone --recursive --depth=1 \
            --branch "$TDESKTOP_BRANCH" \
            https://github.com/telegramdesktop/tdesktop.git
          cd tdesktop
          git fetch --depth=1 origin "$TDESKTOP_COMMIT"
          git checkout "$TDESKTOP_COMMIT"
          echo "=== tdesktop commit ==="
          git rev-parse HEAD

      - name: Apply P0-3b patch and copy source files
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/tdesktop"

          # Apply the diff patch
          git apply --verbose "$GITHUB_WORKSPACE/patches/p03b.patch"
          if [ $? -ne 0 ]; then
            echo "ERROR: Patch failed to apply!"
            exit 1
          fi

          # Copy the new source files
          mkdir -p Telegram/SourceFiles/neko
          for f in neko_config.h neko_config.cpp neko_translate_settings.h neko_translate_settings.cpp; do
            cp "$GITHUB_WORKSPACE/patches/$f" "Telegram/SourceFiles/neko/$f"
          done
          for f in translate_nekogram_provider.h translate_nekogram_provider.cpp; do
            cp "$GITHUB_WORKSPACE/patches/$f" "Telegram/SourceFiles/lang/$f"
          done

          echo "=== Files placed ==="
          ls -la Telegram/SourceFiles/neko/
          ls -la Telegram/SourceFiles/lang/translate_nekogram_provider.*
          echo "=== Verifying patch ==="
          git diff --check

      - name: Remove breakpad stage from prepare.py
        shell: python
        run: |
          import re, pathlib, os
          p = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'tdesktop/Telegram/build/prepare/prepare.py'
          content = p.read_text()
          content = re.sub(
              r"stage\('breakpad',\s*\"\"\"\n.*?\"\"\"\)\n",
              "",
              content,
              count=1,
              flags=re.DOTALL,
          )
          assert "stage('breakpad'" not in content, "breakpad stage was NOT removed"
          assert "stage('crashpad'" in content, "crashpad stage should remain (mac-only)"
          p.write_text(content)
          print("breakpad stage removed successfully")

      - name: Build via vcvars + prepare + configure + cmake
        shell: cmd
        run: |
          @echo off
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 (echo ERROR: vcvarsall failed & exit /b 1)

          cd /d "%GITHUB_WORKSPACE%\tdesktop\Telegram"

          echo === PREPARE (all stages, breakpad removed, silent mode) ===
          call "build\prepare\win.bat" silent
          if errorlevel 1 (echo ERROR: prepare failed & exit /b 1)

          echo === CONFIGURE (test API credentials + no crash reports) ===
          call configure.bat x64 -D TDESKTOP_API_ID=%TDESKTOP_API_ID% -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          if errorlevel 1 (echo ERROR: configure failed & exit /b 1)

          echo === BUILD ===
          cd /d "%GITHUB_WORKSPACE%\tdesktop"
          cmake --build out --config Release
          if errorlevel 1 (echo ERROR: build failed & exit /b 1)

          echo === BUILD SUCCEEDED ===

      - name: Collect build artifacts
        if: success()
        shell: bash
        working-directory: tdesktop
        run: |
          echo "=== Verifying Telegram.exe exists ==="
          find out -name "Telegram.exe" -type f 2>/dev/null
          if [ ! -f "out/Release/Telegram.exe" ]; then
            echo "ERROR: Telegram.exe not found in out/Release/"
            exit 1
          fi

          echo "=== Packaging test build ==="
          mkdir -p artifact
          cp out/Release/Telegram.exe artifact/
          find out/Release -maxdepth 1 -name "*.dll" -exec cp {} artifact/ \; 2>/dev/null || true
          find out/Release -maxdepth 1 -name "*.exe" ! -name "Telegram.exe" -exec cp {} artifact/ \; 2>/dev/null || true

          cp "$GITHUB_WORKSPACE/patches/p03b.patch" artifact/
          cp "$GITHUB_WORKSPACE/docs/P03B_WINDOWS_RUNTIME_TEST.md" artifact/

          cd artifact
          7z a "../nekogram-desktop-p03b-windows-test.zip" * || \
            powershell -Command "Compress-Archive -Path * -DestinationPath '../nekogram-desktop-p03b-windows-test.zip'"

          echo "=== ZIP contents ==="
          cd ..
          7z l nekogram-desktop-p03b-windows-test.zip 2>/dev/null || echo "ZIP created"

          echo "=== Secret scan on artifact ==="
          grep -r "github_pat_\|ghp_\|sk-\|api_key=" artifact/ 2>/dev/null || echo "No secrets found"

      - name: Upload test build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nekogram-desktop-p03b-windows-test-no-breakpad-${{ github.sha }}
          path: tdesktop/nekogram-desktop-p03b-windows-test.zip
          retention-days: 7
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nekogram-desktop-p03b-build-logs-${{ github.sha }}
          path: |
            tdesktop/out/**/*.log
            tdesktop/out/**/*.txt
          retention-days: 3
          if-no-files-found: ignore
